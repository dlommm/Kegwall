# Kegwall — GitLab CI/CD. The release cycle is FULLY AUTOMATED:
#
#   - Every branch push: `test` (typecheck + unit suite + web build). The Playwright
#     E2E suite is NOT run here — it needs browser downloads and a display stack the
#     shared runner may not have; run `npm run test:e2e` locally before releasing.
#   - Every push to main additionally runs `semantic-release` (gated on the
#     $GITLAB_TOKEN CI variable — see that job's comment): conventional commit
#     messages decide the next version (fix -> patch, feat -> minor, a
#     "BREAKING CHANGE:" footer or "!" -> major), CHANGELOG.md and package.json are
#     updated and committed back ([skip ci]), the vX.Y.Z tag is pushed, and a GitLab
#     Release with generated notes is created. Commits that warrant no release
#     (docs/chore/test) simply produce no release.
#   - Every `v*` tag push (i.e. what semantic-release just created): `test`, then
#     `release-image` — the multi-arch Docker build pushed to this project's registry.
#
# So: merge a feat/fix to main -> a version, changelog entry, GitLab release, and
# registry image (version tag + latest) all appear with no manual steps.
#
# Registry: $CI_REGISTRY_IMAGE resolves to ghcr.io/dlommm/kegwall on this
# instance — no hardcoded registry hostname needed, and $CI_REGISTRY_USER /
# $CI_REGISTRY_PASSWORD are short-lived credentials GitLab injects per job.
#
# Tag scheme for a pushed `vX.Y.Z` tag: `X.Y.Z` and `latest`, both pointing at the same
# multi-arch (amd64 + arm64) manifest. `latest` is skipped for prerelease tags
# (anything containing a `-`, e.g. v0.6.0-rc.1) so a prerelease can never move
# `:latest` out from under a real release.

stages:
  - test
  - release

test:
  stage: test
  # Full (non-slim) node image: ships python3/make/g++, which better-sqlite3's
  # native build needs during `npm ci`.
  image: node:22
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run typecheck
    - npm test
    - npm run build

# Tablet kiosk APK (android/ — a WebView wrapper around /tablet/:slug). Built on every
# release tag and on demand from any branch; never blocks a release (allow_failure).
# Unsigned-for-updates by default: without the ANDROID_KEYSTORE_* CI variables this
# produces a debug-signed APK whose signature changes per build (uninstall before
# updating) — see docs/install/android-tablet.md for the one-time keystore setup that
# makes updates install over the top.
android-apk:
  stage: release
  image: cimg/android:2024.01.1
  needs: []
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH'
      when: manual
      allow_failure: true
  variables:
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-home"
  cache:
    key: android-gradle
    paths:
      - .gradle-home/caches/
      - .gradle-home/wrapper/
  script:
    - cd android
    - |
      if [ -n "$ANDROID_KEYSTORE_B64" ]; then
        gradle --no-daemon assembleRelease \
          -PkeystoreB64="$ANDROID_KEYSTORE_B64" \
          -PkeystorePass="$ANDROID_KEYSTORE_PASS" \
          -PkeyAlias="$ANDROID_KEY_ALIAS" \
          -PkeyPass="$ANDROID_KEY_PASS"
        cp app/build/outputs/apk/release/app-release.apk ../kegwall-tablet.apk
      else
        echo "No ANDROID_KEYSTORE_B64 set — building a debug-signed APK (uninstall before updating)."
        gradle --no-daemon assembleDebug
        cp app/build/outputs/apk/debug/app-debug.apk ../kegwall-tablet.apk
      fi
  artifacts:
    name: kegwall-tablet-apk
    paths:
      - kegwall-tablet.apk
    expire_in: never

release-image:
  stage: release
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
  needs: [test]
  timeout: 45m
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    # arm64 covers Raspberry Pi 4/5 installs (docs/install/raspberry-pi.md). Cross-arch
    # emulation needs a privileged runner for the binfmt install; if this step fails on
    # your runner, drop it and change --platform below to linux/amd64 only.
    - docker run --privileged --rm tonistiigi/binfmt --install arm64
    - docker buildx create --use
    - VERSION="${CI_COMMIT_TAG#v}"
    - |
      TAGS="-t $CI_REGISTRY_IMAGE:$VERSION"
      case "$CI_COMMIT_TAG" in
        *-*) echo "Prerelease tag — not moving :latest" ;;
        *)   TAGS="$TAGS -t $CI_REGISTRY_IMAGE:latest" ;;
      esac
      docker buildx build --platform linux/amd64,linux/arm64 --push $TAGS -f Dockerfile .

# Automated release cut (see header). Gated on $GITLAB_TOKEN — a project access token
# (Settings -> Access tokens, role Maintainer, scopes api + write_repository) stored as
# a masked CI/CD variable named GITLAB_TOKEN. Until that variable exists this job simply
# never runs, so the pipeline stays green out of the box. semantic-release's own
# "chore(release): ... [skip ci]" commit doesn't retrigger CI, so no loops.
semantic-release:
  stage: release
  image: node:22
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_TAG == null && $GITLAB_TOKEN'
  needs: [test]
  variables:
    # semantic-release needs the full history + tags to find the last release;
    # GitLab's default shallow clone would hide them.
    GIT_DEPTH: "0"
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    - npm ci --cache .npm --prefer-offline
    - npx semantic-release
    # The release commit carries [skip ci] (so pushing it back doesn't re-run this
    # pipeline), but GitLab ALSO skips the pipeline of a tag pointing at a [skip ci]
    # commit — which would leave every release without its Docker image. API-created
    # pipelines ignore the skip marker, so when semantic-release just tagged HEAD,
    # kick the tag pipeline explicitly.
    - |
      TAG=$(git describe --tags --exact-match HEAD 2>/dev/null || true)
      if [ -n "$TAG" ]; then
        echo "Triggering image pipeline for $TAG"
        curl -sf -X POST -H "PRIVATE-TOKEN: $GITLAB_TOKEN" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/pipeline?ref=$TAG" > /dev/null
      else
        echo "No release cut this run — no tag pipeline to trigger"
      fi
