# Kegwall — GitLab CI/CD.
#
# Two pipelines:
#   - Every branch push: `test` (typecheck + unit suite + web build). The Playwright
#     E2E suite is NOT run here — it needs browser downloads and a display stack the
#     shared runner may not have; run `npm run test:e2e` locally before releasing.
#   - Every `v*` tag push: `test`, then `release-image` (multi-arch Docker build pushed
#     to this project's container registry), then `release` (a GitLab Release entry).
#
# Registry: $CI_REGISTRY_IMAGE resolves to ghcr.io/dlommm/kegwall on this
# instance — no hardcoded registry hostname needed, and $CI_REGISTRY_USER /
# $CI_REGISTRY_PASSWORD are short-lived credentials GitLab injects per job.
#
# Tag scheme for a pushed `vX.Y.Z` tag: `X.Y.Z` and `latest`, both pointing at the same
# multi-arch (amd64 + arm64) manifest. `latest` is skipped for prerelease tags
# (anything containing a `-`, e.g. v0.6.0-rc.1) so a prerelease can never move
# `:latest` out from under a real release.

stages:
  - test
  - release

test:
  stage: test
  # Full (non-slim) node image: ships python3/make/g++, which better-sqlite3's
  # native build needs during `npm ci`.
  image: node:22
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run typecheck
    - npm test
    - npm run build

release-image:
  stage: release
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
  needs: [test]
  timeout: 45m
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    # arm64 covers Raspberry Pi 4/5 installs (docs/install/raspberry-pi.md). Cross-arch
    # emulation needs a privileged runner for the binfmt install; if this step fails on
    # your runner, drop it and change --platform below to linux/amd64 only.
    - docker run --privileged --rm tonistiigi/binfmt --install arm64
    - docker buildx create --use
    - VERSION="${CI_COMMIT_TAG#v}"
    - |
      TAGS="-t $CI_REGISTRY_IMAGE:$VERSION"
      case "$CI_COMMIT_TAG" in
        *-*) echo "Prerelease tag — not moving :latest" ;;
        *)   TAGS="$TAGS -t $CI_REGISTRY_IMAGE:latest" ;;
      esac
      docker buildx build --platform linux/amd64,linux/arm64 --push $TAGS -f Dockerfile .

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
  needs: [release-image]
  script:
    - echo "Creating GitLab Release for $CI_COMMIT_TAG"
  release:
    tag_name: '$CI_COMMIT_TAG'
    name: 'Kegwall $CI_COMMIT_TAG'
    description: 'Container image: `$CI_REGISTRY_IMAGE:latest` (also tagged with this version). Full notes in [CHANGELOG.md](CHANGELOG.md).'
