# Kegwall — CI: typecheck + unit suite + web build on every branch push and pull request.
# main is covered by release.yml, which calls this workflow before cutting a release.
#
# The Playwright E2E suite is NOT run here — it needs browser downloads and a display
# stack; run `npm run test:e2e` locally before releasing.
name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: bash -n scripts/*.sh
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
