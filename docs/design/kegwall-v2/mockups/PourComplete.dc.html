<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pour complete</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#D38D52}a:hover{color:#E6A673}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; box-sizing: border-box; padding: 96px 112px 72px; background: #15110D; color: #F4EBDD; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column">
  <div style="flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 560px; column-gap: 112px; align-items: center">
    <section style="display: flex; flex-direction: column; gap: 18px">
      <p style="margin: 0; font-size: 34px; color: #9FCB8F">Pour complete · Citra Haze on tap 1</p>
      <div style="display: flex; align-items: baseline; gap: 20px; font-variant-numeric: tabular-nums">
        <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 340px; line-height: 0.82">13.9</span>
        <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 104px; color: #C4B5A0">oz</span>
      </div>
      <p style="margin: 0; font-size: 28px; color: #A99A85; font-variant-numeric: tabular-nums">Recorded 412 mL in 6.1 seconds</p>
      <div style="display: flex; flex-direction: column; gap: 14px; margin-top: 56px; max-width: 760px">
        <p style="margin: 0; font-size: 30px; font-variant-numeric: tabular-nums">Keg went from 83% to 81% · ≈ 31 pints left</p>
        <div style="height: 18px; border-radius: 9px; background: #2B231C; overflow: hidden; display: flex">
          <span style="width: 81%; background: #F5CF4A"></span>
          <span style="width: 2%; background: #F2E7CF"></span>
        </div>
      </div>
    </section>
    <aside style="background: #F4EBDD; color: #15110D; border-radius: 28px; padding: 44px; display: flex; flex-direction: column; gap: 24px; align-items: flex-start">
      <h2 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 64px; line-height: 0.95; text-transform: uppercase">Whose pour was this?</h2>
      <p style="margin: 0; font-size: 26px; line-height: 1.4; color: #3B3127">Scan to claim it for your passport. Open for 10 minutes.</p>
      <div style="width: 300px; height: 300px; background: #15110D; border-radius: 16px; display: grid; place-items: center; color: #F4EBDD; font-size: 22px; font-weight: 600">QR code</div>
    </aside>
  </div>
  <footer style="display: flex; align-items: center; gap: 24px">
    <span style="font-size: 24px; color: #A99A85; font-variant-numeric: tabular-nums; white-space: nowrap">Back to the wall in 6 s</span>
    <div style="flex: 1; height: 6px; border-radius: 3px; background: #2B231C; overflow: hidden"><div style="width: 40%; height: 6px; background: #8E806D"></div></div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
