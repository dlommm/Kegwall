<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Concept B — Label</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2E5A45}a:hover{color:#1F3F30}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; box-sizing: border-box; padding: 56px 80px 48px; background: #ECE6DA; color: #1C1915; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; gap: 32px">
  <header style="display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 24px; border-bottom: 6px solid #1C1915">
    <h1 style="margin: 0; font-family: 'Playfair Display', serif; font-weight: 700; font-size: 72px; line-height: 1; letter-spacing: -0.02em">Garage Brewing Co.</h1>
    <p style="margin: 0; font-size: 28px; color: #4F483F; font-variant-numeric: tabular-nums">On tap this Wednesday · 2:22 PM · 38°F</p>
  </header>
  <main style="flex: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(4, minmax(0, 1fr)); grid-auto-flow: column; column-gap: 96px; row-gap: 8px">
    <sc-for list="{{taps}}" as="t" hint-placeholder-count="8">
      <article style="display: grid; grid-template-columns: 76px minmax(0, 1fr) auto; column-gap: 24px; align-items: center; min-width: 0">
        <span style="font-family: 'Playfair Display', serif; font-style: italic; font-weight: 500; font-size: 60px; line-height: 1; color: #7A7064; font-variant-numeric: tabular-nums">{{t.n}}</span>
        <div style="display: flex; flex-direction: column; gap: 6px; min-width: 0">
          <h2 style="margin: 0; font-family: 'Playfair Display', serif; font-weight: 500; font-size: 46px; line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.name}}</h2>
          <p style="margin: 0; font-size: 22px; color: #4F483F; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.meta}}</p>
          <div style="display: flex; align-items: center; gap: 14px; margin-top: 4px">
            <div style="width: 220px; height: 10px; background: #D9D1C2; border-radius: 5px; overflow: hidden"><div style="width: {{t.pct}}; height: 10px; background: {{t.srm}}"></div></div>
            <span style="font-size: 20px; color: {{t.levelInk}}; font-variant-numeric: tabular-nums">{{t.level}}</span>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px; font-variant-numeric: tabular-nums">
          <span style="font-family: 'Playfair Display', serif; font-weight: 500; font-size: 44px; line-height: 1">{{t.abv}}</span>
          <span style="font-size: 20px; color: #4F483F">{{t.ibu}} IBU</span>
        </div>
      </article>
    </sc-for>
  </main>
  <footer style="display: flex; justify-content: space-between; align-items: center; background: #1C1915; color: #ECE6DA; border-radius: 14px; padding: 18px 28px">
    <p style="margin: 0; font-size: 26px">Trivia night Thursday · Happy hour 4–6 pm</p>
    <div style="display: flex; align-items: center; gap: 18px">
      <p style="margin: 0; font-size: 22px">Scan for the menu and claim your pour</p>
      <div style="width: 64px; height: 64px; background: #ECE6DA; border-radius: 8px; display: grid; place-items: center; color: #1C1915; font-size: 13px; font-weight: 600">QR</div>
    </div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
var TAPS = [
  [1, 'Citra Haze', 'Hazy IPA · Garage Brewing', '6.8%', 45, 0.83, '#E4B52C'],
  [2, 'Vienna Nights', 'Vienna Lager · Garage Brewing', '5.0%', 22, 0.50, '#C97A22'],
  [3, 'Belgian Sun', 'Belgian Tripel · Abbey Road Ales', '9.1%', 28, 0.94, '#DDAA2A'],
  [4, 'Midnight Oats', 'Oatmeal Stout · Garage Brewing', '5.6%', 32, 0.04, '#2A140B'],
  [5, 'The Extraordinarily Long-Named Double Dry-Hopped Imperial West Coast IPA', 'Double IPA · Bottle Logic Brewing & Fermentation Laboratory', '8.4%', 85, 0.61, '#D8961F'],
  [6, 'Kriek Reserve', 'Fruited Sour · Wild Cellar', '6.0%', 10, 0.30, '#8E2A22'],
  [7, 'Helles Yeah', 'Munich Helles · Garage Brewing', '4.8%', 18, 0.72, '#E8C640'],
  [8, 'Campfire Porter', 'Smoked Porter · Smokestack', '6.2%', 35, 0.18, '#4A1E0E']
];
class Component extends DCLogic {
  renderVals() {
    return {
      taps: TAPS.map(function (r) {
        var low = r[5] < 0.1;
        return {
          n: r[0], name: r[1], meta: r[2], abv: r[3], ibu: r[4], srm: r[6],
          pct: Math.round(r[5] * 100) + '%',
          level: low ? Math.round(r[5] * 100) + '% — last call' : Math.round(r[5] * 100) + '% left',
          levelInk: low ? '#9A3B1E' : '#4F483F'
        };
      })
    };
  }
}
</script>
</body>
</html>
