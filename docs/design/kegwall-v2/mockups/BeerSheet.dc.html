<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Beer detail and claim</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#E6A673;text-decoration:none}a:hover{color:#F2BE91}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B0907; color: #F4EBDD; font-family: Inter, system-ui, sans-serif; font-size: 15px; position: relative; overflow: hidden">
  <div aria-hidden="true" style="padding: 20px 16px; opacity: 0.35">
    <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 30px">Garage Brewing Co.</div>
  </div>
  <section role="dialog" aria-modal="true" aria-labelledby="bs-h" style="position: absolute; left: 0; right: 0; bottom: 0; top: 72px; background: #1F1914; border-radius: 24px 24px 0 0; padding: 10px 20px 24px; display: flex; flex-direction: column; gap: 18px">
    <span aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #4A3F33"></span>
    <div style="display: flex; gap: 16px; align-items: flex-start">
      <svg viewBox="0 0 60 100" width="58" height="92" aria-hidden="true">
        <defs><clipPath id="bs-g"><path d="M8 4 H52 L46 96 H14 Z"></path></clipPath></defs>
        <g clip-path="url(#bs-g)"><rect x="0" y="21" width="60" height="100" fill="#F5CF4A"></rect><rect x="0" y="17" width="60" height="5" fill="#F2E7CF"></rect></g>
        <path d="M8 4 H52 L46 96 H14 Z" fill="none" stroke="rgba(244,235,221,0.5)" stroke-width="3"></path>
      </svg>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 4px">
        <h2 id="bs-h" style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 36px; line-height: 0.95; text-transform: uppercase">Citra Haze</h2>
        <p style="margin: 0; color: #C4B5A0">Garage Brewing · Hazy IPA</p>
      </div>
      <button type="button" aria-label="Close" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #2A221B; color: #F4EBDD; display: grid; place-items: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    </div>
    <dl style="margin: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; font-variant-numeric: tabular-nums">
      <div style="background: #2A221B; border-radius: 12px; padding: 10px"><dt style="font-size: 12px; color: #A99A85">ABV</dt><dd style="margin: 2px 0 0; font-size: 20px; font-weight: 600">6.8%</dd></div>
      <div style="background: #2A221B; border-radius: 12px; padding: 10px"><dt style="font-size: 12px; color: #A99A85">IBU</dt><dd style="margin: 2px 0 0; font-size: 20px; font-weight: 600">45</dd></div>
      <div style="background: #2A221B; border-radius: 12px; padding: 10px"><dt style="font-size: 12px; color: #A99A85">Tap</dt><dd style="margin: 2px 0 0; font-size: 20px; font-weight: 600">1</dd></div>
      <div style="background: #2A221B; border-radius: 12px; padding: 10px"><dt style="font-size: 12px; color: #A99A85">Keg</dt><dd style="margin: 2px 0 0; font-size: 20px; font-weight: 600">83%</dd></div>
    </dl>
    <p style="margin: 0; line-height: 1.5">Bright citrus and dank pine, brewed hazy. Pours a cloudy straw gold.</p>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-weight: 600">Your rating</span>
      <div role="group" aria-label="Rate Citra Haze" style="display: flex; gap: 6px">
        <sc-for list="{{stars}}" as="s" hint-placeholder-count="5">
          <button type="button" onClick="{{s.pick}}" aria-label="{{s.label}}" aria-pressed="{{s.on}}" style="width: 48px; height: 48px; border-radius: 12px; border: 0; background: #2A221B; display: grid; place-items: center">
            <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9Z" fill="{{s.fill}}" stroke="#E6A673" stroke-width="1.5" stroke-linejoin="round"></path></svg>
          </button>
        </sc-for>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px; margin-top: auto">
      <span style="font-weight: 600">Was one of these yours?</span>
      <span style="color: #A99A85; font-size: 14px">Pours can be claimed for 10 minutes.</span>
      <sc-for list="{{pours}}" as="p" hint-placeholder-count="2">
        <div style="display: flex; align-items: center; gap: 12px; background: #2A221B; border-radius: 14px; padding: 10px 10px 10px 14px">
          <span style="flex: 1; display: flex; flex-direction: column"><strong style="font-weight: 600">{{p.what}}</strong><span style="font-size: 13px; color: #A99A85">{{p.when}}</span></span>
          <button type="button" style="height: 44px; padding: 0 16px; border-radius: 12px; border: 0; background: #D38D52; color: #1A120B; font-weight: 600">That was me</button>
        </div>
      </sc-for>
      <span style="font-size: 13px; color: #A99A85">Claiming as Alex Rivera · <a href="#">Not you?</a></span>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { rating: 4 }; }
  renderVals() {
    var self = this;
    return {
      stars: [1, 2, 3, 4, 5].map(function (n) {
        return { label: n + ' of 5', on: n <= self.state.rating ? 'true' : 'false', fill: n <= self.state.rating ? '#E6A673' : 'none', pick: function () { self.setState({ rating: n }); } };
      }),
      pours: [
        { what: 'Tap 1 · 13.9 oz', when: 'Citra Haze · 1 min ago' },
        { what: 'Tap 2 · 12.0 oz', when: 'Vienna Nights · 3 min ago' }
      ]
    };
  }
}
</script>
</body>
</html>
