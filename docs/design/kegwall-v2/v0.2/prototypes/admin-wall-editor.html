<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin · Wall Editor</title>
<link rel="stylesheet" href="admin.css">
<style>
  .head { display: flex; justify-content: space-between; align-items: center; margin-top: 22px; gap: 20px; }
  .head h1 { margin: 0; font-size: 34px; font-weight: 700; line-height: 1.1; }
  .head .crumb { color: var(--ink-3); font-size: 15px; }
  .dirty { color: var(--caution); font-weight: 700; display: inline-flex; align-items: center; gap: 8px; }
  .dirty::before { content: ''; width: 9px; height: 9px; border-radius: 50%; background: var(--caution); }
  .studio { display: grid; grid-template-columns: 196px minmax(0, 1fr) 404px; gap: 24px; margin-top: 22px; align-items: start; }
  .rail { display: flex; flex-direction: column; gap: 2px; }
  .rail a { min-height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; border-radius: 9px; color: var(--ink-2); text-decoration: none; }
  .rail a.on { background: var(--raise-2); color: var(--ink); font-weight: 700; }
  .rail a i { width: 7px; height: 7px; border-radius: 50%; background: var(--caution); }
  .preview { min-width: 0; }
  .preview .scr { background: #050505; border-radius: 10px; padding: 14px; }
  .preview img { display: block; width: 100%; border-radius: 3px; }
  .preview .meta { display: flex; justify-content: space-between; margin-top: 12px; color: var(--ink-3); font-size: 14px; }
  .preview .seg { display: inline-flex; background: var(--raise); border-radius: 10px; padding: 3px; gap: 2px; }
  .preview .seg span { height: 34px; padding: 0 12px; border-radius: 8px; display: inline-flex; align-items: center; font-size: 14px; color: var(--ink-2); }
  .preview .seg span.on { background: #34302A; color: var(--ink); }
  .live { margin-top: 18px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .live .panel { padding: 14px 16px; }
  .live .panel b { display: block; font-size: 15px; }
  .live .panel span { font-size: 14px; color: var(--ink-3); }
  .insp { background: var(--raise); border-radius: 12px; padding: 20px; }
  .insp h2 { margin: 0; font-size: 20px; font-weight: 700; }
  .insp p { margin: 4px 0 14px; color: var(--ink-3); font-size: 14px; }
  .looks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .lk { border-radius: 9px; padding: 6px 6px 8px; background: var(--raise-2); }
  .lk.on { box-shadow: 0 0 0 2px var(--ink); }
  .lk img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 4px; }
  .lk b { display: flex; justify-content: space-between; font-size: 14px; margin-top: 7px; padding: 0 2px; }
  .lk b small { color: var(--ink-3); font-weight: 400; }
  .sub2 { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .colors { display: flex; gap: 8px; flex-wrap: wrap; }
  .colors span { width: 40px; height: 40px; border-radius: 9px; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.18); }
  .colors span.on { box-shadow: 0 0 0 2px var(--raise), 0 0 0 4px var(--ink); }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="data.js"></script>
<script src="admin.js"></script>
<script>
  const LOOKS = [
    ['Just Tapped', 'a-tv', 'New'], ['Tap Handles', 'b-tv', 'New'], ['Tally', 'c-tv', 'New'], ['Classic', 'look-classic'],
    ['Ledger', 'look-ledger'], ['Gallery', 'look-gallery'], ['Columns', 'look-columns'], ['Chalkboard', 'look-chalkboard'],
    ['Editorial', 'look-editorial'], ['Neon', 'look-neon'], ['Terminal', 'look-terminal'], ['Poster', 'look-poster'],
    ['Departures', 'look-departures'], ['Zen', 'look-zen'],
  ];
  const sections = [['Look', 1], ['Colors', 0], ['What shows', 0], ['Taps and pages', 0], ['Pour takeover', 1], ['Rotation and sleep', 0], ['Screen fit', 0], ['Custom CSS', 0]];
  document.getElementById('app').innerHTML = `${topNav('Screens')}
    <div class="head"><div><div class="crumb">Screens / Walls</div><h1>Main wall</h1></div>
      <div style="display:flex;align-items:center;gap:12px"><span class="dirty">2 changes not on the TVs yet</span><a class="btn q" href="#">Discard</a><a class="btn s" href="#">Preview a pour</a><a class="btn p" href="#">Save to 2 TVs</a></div></div>
    <div class="studio">
      <div class="rail">${sections.map(([s, d], i) => `<a class="${i === 0 ? 'on' : ''}" href="#">${s}${d ? '<i aria-label="changed"></i>' : ''}</a>`).join('')}</div>
      <div class="preview">
        <div class="scr"><img src="../renders/a-tv.jpg" alt="Preview of the Main wall in the Just Tapped look"></div>
        <div class="meta"><span class="seg"><span class="on">Wall</span><span>Live pour</span><span>Screensaver</span></span><span class="num">1080p · 55 in · scale 1.0 · page 1 of 1</span></div>
        <div class="live">
          <div class="panel"><b>Shows taps 1–11</b><span>From 4 Kegtron Pro monitors</span></div>
          <div class="panel"><b>Living room TV, Patio TV</b><span>Both get this on save</span></div>
          <div class="panel"><b>Spotlight: newest keg</b><span>Kriek Reserve, tapped Tuesday</span></div>
        </div>
      </div>
      <div class="insp">
        <h2>Look</h2><p>The layout of the whole screen. Every look shows the same taps, pours and pints.</p>
        <div class="looks">${LOOKS.map(([n, f, tag], i) => `<div class="lk ${i === 0 ? 'on' : ''}"><img src="../renders/${f}.jpg" alt=""><b>${n}<small>${i === 0 ? 'Selected' : tag ?? ''}</small></b></div>`).join('')}</div>
        <div class="sub2"><h2>Spotlight</h2>
          <div class="tabs"><span class="on">Newest keg</span><span>Pinned beer</span><span>Rotate new</span></div>
          <h2 style="margin-top:8px">Colors</h2>
          <div class="colors"><span class="on" style="background:#0D0C0B"></span><span style="background:#14201A"></span><span style="background:#0E1A1C"></span><span style="background:#1A120B"></span><span style="background:#F3EEE4"></span><span style="background:#FAFAF7"></span><span style="background:#0B0820"></span></div>
          <span style="font-size:14px;color:var(--ink-3)">The wall's ground and ink. Beer colors always come from each beer.</span>
        </div>
      </div>
    </div>`;
</script>
</body>
</html>
