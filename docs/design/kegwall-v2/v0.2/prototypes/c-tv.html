<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>C · Tally — TV wall</title>
<link rel="stylesheet" href="c.css">
<style>
  .stage { width: 1920px; height: 1080px; padding: 60px 80px 48px; display: flex; flex-direction: column; overflow: hidden; }
  header { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 60px; align-items: end; }
  h1 { margin: 0; font-size: 76px; line-height: 1.02; font-weight: 700; letter-spacing: -0.015em; max-width: 1400px; }
  header .side { text-align: right; font-size: 28px; color: var(--ink-2); line-height: 1.4; }
  header .side b { display: block; font-size: 56px; color: var(--ink); font-weight: 700; }
  main { flex: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(6, minmax(0, 1fr)); grid-auto-flow: column; column-gap: 96px; margin-top: 40px; --sw: 4px; --sh: 42px; --sg: 3px; --gg: 9px; }
  .tap { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto 64px; column-gap: 22px; align-items: center; border-top: 3px solid var(--ink); }
  .tap .n { font-size: 30px; font-weight: 700; color: var(--ink-3); }
  .tap .nm { font-size: 36px; font-weight: 700; line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tap .st { font-size: 22px; color: var(--ink-2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tap .c { font-size: 42px; font-weight: 700; text-align: right; }
  .tap.low .c, .tap.low .st b { color: var(--caution); }
  .tap.kicked .nm { color: var(--ink-3); text-decoration: line-through; text-decoration-thickness: 3px; }
  .tap.pouring { background: var(--ink); color: var(--board); border-top-color: var(--ink); margin: 0 -18px; padding: 0 18px; }
  .tap.pouring .st, .tap.pouring .n { color: #BDB8AF; }
  footer { display: flex; justify-content: space-between; align-items: center; margin-top: 22px; font-size: 24px; color: var(--ink-2); }
  footer i { width: 84px; height: 84px; background: var(--ink); color: var(--board); display: grid; place-items: center; font-style: normal; font-weight: 700; font-size: 15px; border-radius: 4px; }
  footer span { display: flex; align-items: center; gap: 18px; }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script src="data.js"></script>
<script>
  const tally = (t) => {
    const fill = t.pints, beer = lum(t.srm) > 0.45 ? shade(t.srm, 0.82) : t.srm;
    const groups = [];
    for (let g = 0; g < Math.ceil(t.fullPints / 5); g++) {
      let s = '';
      for (let k = 0; k < 5; k++) { const i = g * 5 + k; if (i >= t.fullPints) break; s += `<i class="${i < fill ? 'f' : ''}"></i>`; }
      groups.push(`<span>${s}</span>`);
    }
    return `<div class="tally" style="--beer:${beer}">${groups.join('')}</div>`;
  };
  const tap = (t) => {
    const pouring = t.n === 2;
    return `<div class="tap ${t.low ? 'low' : ''} ${t.kicked ? 'kicked' : ''} ${pouring ? 'pouring' : ''}">
      <span class="n num">${t.n}</span>
      <span style="min-width:0"><div class="nm">${esc(t.name)}</div><div class="st">${pouring ? '<b>Pouring now · 6.2 oz so far</b>' : t.kicked ? 'Kicked Monday · Harvest Märzen goes on next' : `${esc(t.style)} · ${t.abv}%${t.isNew ? ' · <b>just tapped</b>' : ''}`}</div></span>
      ${t.kicked ? '<span></span>' : tally(t)}
      <span class="c num">${t.kicked ? '' : t.pints}</span>
    </div>`;
  };
  const low = TAPS.filter((t) => t.low);
  document.getElementById('stage').innerHTML = `
    <header>
      <h1>Eleven on tap tonight. Midnight Oats is down to its last pint, and Kriek Reserve just went on.</h1>
      <div class="side num"><b>8:42 PM</b>Garage Brewing Co. · 38°F</div>
    </header>
    <main>${TAPS.map(tap).join('')}</main>
    <footer><span>Each mark is a pint still in the keg.</span><span>Scan for the menu and to claim your pour<i>QR</i></span></footer>`;
</script>
</body>
</html>
