<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A · Just Tapped — phone menu</title>
<link rel="stylesheet" href="a.css">
<style>
  body { background: #1E0B0A; }
  .hero .bar, .hero h1 { z-index: 1; }
  .hero { position: relative; height: 360px; overflow: hidden; }
  .hero { background: var(--feat); color: var(--feat-ink); }
  .hero .bignum { position: absolute; right: -14px; top: -40px; font-family: var(--display); font-weight: 900; font-size: 380px; line-height: 1; color: var(--feat-shade); }
    .hero .bar { position: absolute; top: 14px; left: 16px; right: 16px; z-index: 1; display: flex; justify-content: space-between; align-items: center; }
  .hero .bar b { font-family: var(--display); font-weight: 800; font-size: 22px; text-transform: uppercase; }
  .hero .bar a { height: 40px; padding: 0 14px; border-radius: 20px; background: rgba(13,12,11,0.75); color: var(--ink); display: flex; align-items: center; gap: 8px; text-decoration: none; font-size: 15px; }
  .hero .bar a i { width: 24px; height: 24px; border-radius: 50%; background: #7FA2E0; color: #111; font-style: normal; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
  .hero h1 { position: absolute; left: 16px; right: 16px; bottom: 6px; margin: 0; z-index: 1; font-size: 78px; line-height: 0.84; }
  main { padding: 0 16px 32px; }
  .lede { margin: 12px 0 0; font-size: 17px; line-height: 1.45; }
  .lede b { font-weight: 700; }
  .claim { margin-top: 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--ink); color: #15110D; border-radius: 14px; padding: 12px 12px 12px 16px; }
  .claim span { font-size: 16px; line-height: 1.3; }
  .claim a { flex: none; height: 44px; padding: 0 16px; border-radius: 11px; background: #15110D; color: var(--ink); display: flex; align-items: center; text-decoration: none; font-weight: 700; }
  .search { margin-top: 22px; height: 48px; border-radius: 12px; background: rgba(255,255,255,0.08); display: flex; align-items: center; padding: 0 14px; color: var(--ink-2); font-size: 16px; gap: 10px; }
  .chips { display: flex; gap: 8px; margin-top: 12px; overflow: hidden; }
  .chips span { flex: none; height: 38px; padding: 0 14px; border-radius: 19px; background: rgba(255,255,255,0.08); display: flex; align-items: center; font-size: 15px; }
  .chips span.on { background: var(--ink); color: #15110D; font-weight: 700; }
  h2 { font-family: var(--display); font-weight: 800; font-size: 32px; text-transform: uppercase; margin: 26px 0 8px; }
  ol { list-style: none; margin: 0; padding: 0; }
  li { display: grid; grid-template-columns: 54px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 10px 0; border-top: 1px solid rgba(255,255,255,0.09); }
  li img, li .art-fallback { width: 54px; height: 54px; object-fit: cover; border-radius: 4px; font-size: 22px; }
  li .nm { font-size: 25px; line-height: 1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  li .st { font-size: 14px; color: var(--ink-2); margin-top: 4px; }
  li .left { text-align: right; line-height: 1; }
  li .left b { font-family: var(--display); font-weight: 800; font-size: 28px; }
  li .left span { display: block; font-size: 12px; color: var(--ink-2); }
  li.low .left b, li.low .left span { color: var(--caution); }
</style>
</head>
<body>
<div id="app"></div>
<script src="data.js"></script>
<script>
  const feat = TAPS.find((t) => t.isNew);
  const r = document.documentElement.style; r.setProperty('--feat', feat.srm); r.setProperty('--feat-ink', inkOn(feat.srm)); r.setProperty('--feat-shade', shade(feat.srm, 0.8));
  const rows = TAPS.filter((t) => !t.kicked && t !== feat).map((t) => `<li class="${t.low ? 'low' : ''}">
      ${marker(t, 54)}
      <span style="min-width:0"><div class="nm name">${esc(t.name)}</div><div class="st">Tap ${t.n} · ${esc(t.style)} · ${t.abv}%</div></span>
      <span class="left num"><b>${t.pints}</b><span>${t.pints === 1 ? 'pint' : 'pints'} left</span></span></li>`).join('');
  document.getElementById('app').innerHTML = `
    <header class="hero">
      <span class="bignum num">${feat.n}</span>
      <div class="bar"><b>Garage Brewing Co.</b><a href="#"><i>AR</i>Passport</a></div>
      <h1 class="name">${esc(feat.name)}</h1>
    </header>
    <main>
      <p class="lede"><b>Just tapped on tap ${feat.n}.</b> ${esc(feat.brewery)}'s fruited sour, ${feat.abv}%. About ${feat.pints} pints left.</p>
      <div class="claim"><span>Two pours in the last ten minutes have no name yet.</span><a href="#">Claim one</a></div>
      <div class="search">Search eleven beers</div>
      <div class="chips"><span class="on">All</span><span>New</span><span>Almost gone</span><span>Hoppy</span><span>Dark</span></div>
      <h2>On tap</h2>
      <ol>${rows}</ol>
    </main>`;
</script>
</body>
</html>
