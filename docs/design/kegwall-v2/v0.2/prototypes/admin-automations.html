<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin · Automations</title>
<link rel="stylesheet" href="admin.css">
<style>
  .lay { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 40px; margin-top: 26px; align-items: start; }
  .rule { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 18px; align-items: center; padding: 18px 20px; border-radius: 12px; background: var(--raise); }
  .rule + .rule { margin-top: 10px; }
  .rule p { margin: 0; font-size: 20px; line-height: 1.35; }
  .rule p em { font-style: normal; background: var(--raise-2); border-radius: 6px; padding: 1px 8px; box-shadow: inset 0 0 0 1px #3A352F; }
  .rule small { display: block; font-size: 14px; color: var(--ink-3); margin-top: 6px; }
  .rule.off p { color: var(--ink-3); }
  .build { background: var(--raise); border-radius: 12px; padding: 22px; display: flex; flex-direction: column; gap: 14px; }
  .build h2 { margin: 0; font-size: 22px; font-weight: 700; }
  .chip { display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 10px; background: var(--raise-2); box-shadow: inset 0 0 0 1.5px #4E4840; font-weight: 700; }
  .sent { font-size: 20px; line-height: 2.6; }
  .runs { display: flex; flex-direction: column; gap: 10px; margin-top: 30px; }
  .runs div { display: grid; grid-template-columns: 130px 110px minmax(0, 1fr); gap: 14px; align-items: center; font-size: 15px; padding: 10px 0; border-top: 1px solid var(--line); }
  .runs span.t { color: var(--ink-3); }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="data.js"></script>
<script src="admin.js"></script>
<script>
  const rules = [
    ['enabled', 'When <em>a keg drops below 15%</em>, <em>notify the owners</em> in the app and by email.', 'Last ran today at 7:58 PM for Old Thunder · tap 11'],
    ['executing', 'When <em>a pour finishes</em>, show <em>"{beer} poured on tap {tap}"</em> on the Main wall for 6 s.', 'Running now for Citra Haze on tap 1'],
    ['pending', 'Every <em>Sunday at 9 AM</em>, remind me to <em>clean lines</em> due in the next 7 days.', 'Next run Sunday 9:00 AM'],
    ['failed', 'When <em>the kegerator goes above 42°F</em>, <em>send a push</em> to Owner\'s phone.', 'Failed at 6:14 PM: the push service rejected the device token. Reconnect the phone in Notifications.'],
    ['disabled', 'When <em>a tap is kicked</em>, <em>turn the Patio TV off</em> through Home Assistant.', 'Off since Oct 2'],
  ];
  document.getElementById('app').innerHTML = `${topNav('Settings')}
    <h1 class="say">Five rules. One failed tonight and needs a fix.</h1>
    <p class="say">The temperature alert couldn't reach your phone at 6:14 PM. Everything else ran on time.</p>
    <div class="lay">
      <div>
        ${rules.map(([s, txt, sub]) => `<div class="rule ${s === 'disabled' ? 'off' : ''}">${stateTag(s)}<p>${txt}<small style="${s === 'failed' ? 'color:var(--problem)' : ''}">${esc(sub)}</small></p><a class="btn q" href="#">Edit</a><span class="switch ${s === 'disabled' ? '' : 'on'}"></span></div>`).join('')}
        <div class="runs"><h2 class="sec" style="font-size:28px">Recent runs</h2>
          <div><span class="t num">8:41 PM</span>${stateTag('completed')}<span>Pour banner · Citra Haze, 13.9 oz</span></div>
          <div><span class="t num">7:58 PM</span>${stateTag('completed')}<span>Keg below 15% · Old Thunder · email sent to 1 owner</span></div>
          <div><span class="t num">6:14 PM</span>${stateTag('failed')}<span>Kegerator above 42°F · push not delivered</span></div>
        </div>
      </div>
      <div class="build"><h2>New rule</h2>
        <div class="sent">When <span class="chip">a keg drops below</span> <span class="chip num">10%</span><br>then <span class="chip">show a banner</span> on <span class="chip">all walls</span></div>
        <div class="field"><label>Banner text</label><div class="in">Last call on {beer}: about {pints} pints left</div><span class="help">Preview: "Last call on Midnight Oats: about 1 pint left".</span></div>
        <div style="display:flex;gap:10px"><a class="btn p" href="#">Save rule</a><a class="btn s" href="#">Test on the Main wall</a></div>
        <span style="font-size:14px;color:var(--ink-3)">A test shows the banner for 6 s and records nothing.</span>
      </div>
    </div>`;
</script>
</body>
</html>
