<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin · menus</title>
<link rel="stylesheet" href="admin.css">
<style>
  body { height: 900px; overflow: hidden; }
  .dim { opacity: 0.32; pointer-events: none; }
  .ghost h1 { margin: 34px 0 0; font-size: 60px; line-height: 1.04; font-weight: 700; max-width: 780px; }
  .ghost p { font-size: 20px; color: var(--ink-2); max-width: 700px; }
  .palette { position: absolute; left: 50%; top: 300px; transform: translateX(-50%); width: 640px; padding: 0; overflow: hidden; }
  .palette .q { height: 60px; display: flex; align-items: center; padding: 0 20px; font-size: 20px; box-shadow: 0 1px 0 #34302A; gap: 12px; }
  .palette .q span { color: var(--ink-3); }
  .palette .mi { margin: 0 8px; }
  .palette .grp { padding: 10px 20px 4px; font-size: 13px; color: var(--ink-3); }
  .palette .foot { display: flex; gap: 18px; padding: 10px 20px; font-size: 13px; color: var(--ink-3); box-shadow: 0 -1px 0 #34302A; margin-top: 6px; }
  .lbl { position: absolute; font-size: 13px; font-weight: 700; color: #111; background: var(--caution); padding: 3px 8px; border-radius: 5px; z-index: 6; }
</style>
</head>
<body>
<div class="wrap" style="position:relative" id="app"></div>
<script src="data.js"></script>
<script src="admin.js"></script>

</body>
</html>
