# Kegwall unattended Debian install (preseed) — Debian 12/13, amd64 or arm64.
#
# Feeds the STOCK Debian installer so a bare machine installs Debian AND then Kegwall with no
# interaction. It does NOT install Kegwall in the installer chroot (systemd isn't running there);
# instead it drops kegwall-firstboot.service, which runs pi-install.sh on the first real boot.
#
# HOW TO USE (two ways) — see docs/install/unattended-debian.md:
#   1. URL: host this file, boot the Debian installer with:
#        auto=true priority=critical preseed/url=https://…/preseed.cfg
#   2. Baked ISO: remaster the stock ISO with this file inside (scripts/build-kegwall-iso.sh).
#
# ⚠ THIS ERASES THE TARGET DISK (guided whole-disk partitioning).
# ⚠ CHANGE the user password below before you use this for real — it ships a placeholder.
# ⚠ To TEST from a branch before it's on main, change the `raw/main/` refs in late_command (and
#   set KEGWALL_REF) to your branch name.

### Localization — adjust to taste
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

### Network — DHCP, auto-pick the wired interface
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string kegwall
d-i netcfg/get_domain string local
d-i netcfg/hostname string kegwall

### Mirror
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

### Clock / timezone — set your own zone
d-i clock-setup/utc boolean true
d-i time/zone string UTC
d-i clock-setup/ntp boolean true

### Accounts — no root login; one sudo user. CHANGE THIS PASSWORD.
d-i passwd/root-login boolean false
d-i passwd/user-fullname string Kegwall Admin
d-i passwd/username string kegadmin
d-i passwd/user-password password changeme
d-i passwd/user-password-again password changeme
d-i user-setup/allow-password-weak boolean true
d-i user-setup/encrypt-home boolean false

### Partitioning — Guided, use ENTIRE DISK, all files in one partition (erases that disk).
### Auto-pick the target: the LARGEST fixed disk, never a removable/USB drive, and never the disk
### the installer booted from (/cdrom's backing device). This runs before partitioning and sets
### partman-auto/disk + the GRUB target, so there's no "which disk?" prompt.
d-i partman/early_command string \
  src=$(awk '$2=="/cdrom"{print $1; exit}' /proc/mounts); \
  srcdisk=$(echo "$src" | sed -e 's#[0-9]*$##' -e 's#p$##' -e 's#/dev/##'); \
  best=; bestsz=0; \
  for d in /sys/block/*; do \
    n=${d##*/}; \
    case $n in loop*|ram*|sr*|fd*|dm-*|md*|nbd*) continue;; esac; \
    if [ -f "$d/removable" ] && [ "$(cat "$d/removable")" = 1 ]; then continue; fi; \
    if [ "$n" = "$srcdisk" ]; then continue; fi; \
    sz=$(cat "$d/size" 2>/dev/null || echo 0); \
    if [ "$sz" -gt "$bestsz" ]; then bestsz=$sz; best=/dev/$n; fi; \
  done; \
  if [ -n "$best" ]; then debconf-set partman-auto/disk "$best"; debconf-set grub-installer/bootdev "$best"; fi
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
# Auto-wipe any existing LVM/RAID on the target (reinstalls) without prompting.
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-md/confirm boolean true

### Base + packages — pull the tools the first-boot installer needs
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string curl ca-certificates sudo openssh-server plymouth plymouth-themes
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

### Bootloader
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default

### Don't wait at the end — reboot into the new system
d-i finish-install/reboot_in_progress note

### Late command — inside the freshly installed target. SSH is already installed+enabled (the
### ssh-server task above), so the box is reachable right after Debian reboots. The Kegwall install
### does NOT run at boot; it runs on your FIRST interactive SSH login (visible, and never able to
### block the box from coming up on the network). KEGWALL_ARGS controls the profile (--native-wall
### = cog/WPE wall on this screen; drop it for a headless server; --os-updates auto = unattended OS
### updates). Re-runnable any time with: sudo kegwall-setup
d-i preseed/late_command string \
  in-target sh -c 'set -e; \
    B=https://raw.githubusercontent.com/dlommm/Kegwall/main/deploy/debian; \
    REF=$(echo "$B" | sed -e "s#.*/raw/##" -e "s#/deploy/debian##"); \
    curl -fsSL "$B/kegwall-firstboot.sh" -o /usr/local/sbin/kegwall-firstboot.sh; \
    chmod +x /usr/local/sbin/kegwall-firstboot.sh; \
    ln -sf /usr/local/sbin/kegwall-firstboot.sh /usr/local/sbin/kegwall-setup; \
    curl -fsSL "$B/kegwall-setup-login.sh" -o /etc/profile.d/kegwall-setup.sh; \
    curl -fsSL "$B/kegwall-console.sh" -o /usr/local/sbin/kegwall-console.sh; \
    chmod +x /usr/local/sbin/kegwall-console.sh; \
    /usr/local/sbin/kegwall-console.sh; \
    curl -fsSL "$B/kegwall-plymouth-setup.sh" -o /usr/local/sbin/kegwall-plymouth-setup.sh; \
    chmod +x /usr/local/sbin/kegwall-plymouth-setup.sh; \
    sh /usr/local/sbin/kegwall-plymouth-setup.sh "$REF" || true; \
    printf "KEGWALL_ARGS=\"--native-wall --os-updates auto\"\nKEGWALL_REF=$REF\n" > /etc/kegwall-firstboot.env; \
    chage -d 0 kegadmin || true; \
    systemctl enable ssh'
