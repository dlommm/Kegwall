# Kegwall — Unraid Docker Compose file.
#
# For the Unraid "Compose Manager" plugin (or `docker compose` on any host that
# follows Unraid's /mnt/user/appdata convention). Pulls the published image from
# the project's container registry — no local build.
#
#   - Image: ghcr.io/dlommm/kegwall:latest (multi-arch amd64/arm64,
#     `latest` always points at the newest stable release; pin a version tag like
#     `:0.5.0` instead if you prefer explicit upgrades).
#   - Data: bind-mounted to /mnt/user/appdata/kegwall — holds app.db (SQLite),
#     uploaded label images, and staged backup/restore files. Back it up like any
#     other appdata share (CA Appdata Backup covers it).
#   - Update: re-pull and recreate, e.g. `docker compose pull && docker compose up -d`
#     from this file's directory, or Compose Manager's "Update Stack".
#
# HOST networking on purpose: Kegtron's local UDP pour stream (multicast
# 239.50.50.50, port 50505) does NOT cross Docker's default bridge network — on
# bridge, the app's connection doctor reports exactly that and live sub-second pour
# updates never arrive. With network_mode: host the app joins the multicast group on
# the Unraid host's own interfaces, so the packets reach it (and direct BLE would
# too). Remember it also needs BOTH of: the "Listen for Kegtron UDP broadcasts"
# toggle in Settings -> Sources (off by default), and UDP streaming enabled on the
# Kegtron device itself; multicast never crosses VLANs. Consequences:
#   - No `ports:` mapping (invalid with host networking): the UI is at
#     http://<unraid-ip>:8080 directly. If 8080 collides with another container on
#     the host, override with `- PORT=8081` (or similar) under environment.
#   - If you DON'T need live UDP pours (cloud polling + MQTT only), bridge works:
#     replace `network_mode: host` with a `ports: ["8080:8080"]` block.
# See ../docs/install/docker.md#networking for the full tradeoffs.

services:
  kegwall:
    image: ghcr.io/dlommm/kegwall:latest
    container_name: kegwall
    restart: unless-stopped
    network_mode: host
    volumes:
      - /mnt/user/appdata/kegwall:/data
    # Uncomment together with the watchtower service below to opt this container
    # into automatic updates:
    # labels:
    #   - com.centurylinklabs.watchtower.enable=true
    environment:
      - NODE_ENV=production
      # PORT, DATA_DIR and WEB_DIR are set by the image itself; override only
      # if you know you need to (see ../docs/install/docker.md).

  # Optional: updates without SSH. Watchtower in HTTP-API mode powers the admin UI's
  # Settings → System → "Update now" button (set mode "Docker — Watchtower sidecar",
  # URL http://127.0.0.1:8090, and the same token there). Uncomment this block AND
  # the labels: block above. The API listens on loopback only. For fully automatic
  # background updates too, add WATCHTOWER_HTTP_API_PERIODIC_POLLS=true under
  # environment and --interval 300 to the command.
  # watchtower:
  #   image: containrrr/watchtower:latest
  #   container_name: kegwall-watchtower
  #   restart: unless-stopped
  #   ports:
  #     - "127.0.0.1:8090:8080"
  #   environment:
  #     - WATCHTOWER_HTTP_API_TOKEN=change-me   # generate: openssl rand -hex 16
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #   command: --http-api-update --label-enable --cleanup
